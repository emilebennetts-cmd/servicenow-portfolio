name: KI collector failure-mode gallery browser contract
on:
  push:
    branches: [main]
    paths:
      - 'knowledge-intelligence-acceptance-matrix.html'
      - 'scripts/test_ki_collector_contract.py'
      - 'scripts/browser_ki_collector_contract.py'
      - '.github/workflows/ki-collector-contract-browser.yml'
  pull_request:
    paths:
      - 'knowledge-intelligence-acceptance-matrix.html'
      - 'scripts/test_ki_collector_contract.py'
      - 'scripts/browser_ki_collector_contract.py'
      - '.github/workflows/ki-collector-contract-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Validate source boundary, keyboard, four viewports and JSON exports
        run: |
          python -m unittest scripts/test_ki_collector_contract.py -v
          python scripts/browser_ki_collector_contract.py
