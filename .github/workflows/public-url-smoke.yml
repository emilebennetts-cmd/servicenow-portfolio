name: Anonymous public portfolio HTTPS smoke
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'problem-management-implementation-lab.html'
      - 'incident-management-implementation-lab.html'
      - 'incident-management-implementation-lab.js'
      - 'delivery-release-evolution.html'
      - 'diagnostic-workbench-case-study.html'
      - 'visual-evidence.html'
      - 'delivery-case-study.html'
      - 'reusable-delivery-patterns-case-study.html'
      - 'diagnostic-delivery-handoff-contract.html'
      - 'cmdb-ire-assurance.html'
      - 'cmdb-tag-governance-lab.html'
      - 'itsm-greenfield-build-sequencer.html'
      - 'ki-matrix-intake.html'
      - 'technical-evidence-register.html'
      - 'portfolio-review-guide.html'
      - 'scripts/check_public_https.py'
      - 'tests/test_public_https_smoke.py'
      - '.github/workflows/public-url-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-https-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  anonymous-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test route identity, stale-byte rejection and non-certifying receipts
        run: python -m unittest discover -s tests -p 'test_public_https_smoke.py' -v
      - name: Check published markers exist in the source
        run: python scripts/check_public_https.py --mode local
      - name: Match fifteen anonymous public HTML routes byte-for-byte to checkout
        run: python scripts/check_public_https.py --mode live --attempts 12 --retry-seconds 20
      - name: Keep a redacted machine-readable delivery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-public-https-receipt
          path: public-https-smoke-receipt.json
          if-no-files-found: warn
          retention-days: 30
