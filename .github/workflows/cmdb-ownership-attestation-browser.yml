name: CMDB ownership assurance — offline browser and HOLD controls
on:
  push:
    branches: [main]
    paths:
      - 'cmdb-ownership-attestation-lab.html'
      - 'cmdb-ownership-attestation-model.js'
      - 'tests/cmdb_ownership_attestation.test.cjs'
      - 'scripts/browser_cmdb_ownership_attestation.py'
      - '.github/workflows/cmdb-ownership-attestation-browser.yml'
  pull_request:
    paths:
      - 'cmdb-ownership-attestation-lab.html'
      - 'cmdb-ownership-attestation-model.js'
      - 'tests/cmdb_ownership_attestation.test.cjs'
      - 'scripts/browser_cmdb_ownership_attestation.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixed six-gate model and non-certifying export
        run: node --test tests/cmdb_ownership_attestation.test.cjs
      - name: Install Chromium browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install chromium --only-shell
      - name: Four-width offline interactions and safe CSV
        run: python scripts/browser_cmdb_ownership_attestation.py
