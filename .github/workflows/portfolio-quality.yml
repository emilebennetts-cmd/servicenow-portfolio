name: Portfolio quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Change Management browser-local model and HOLD-only CSV
        run: node tests/change_management_dom_smoke.js
      - name: Test Request Management browser-only controls and HOLD CSV
        run: node --test tests/request_management_lab.test.cjs
      - name: Test Knowledge Management native handoff and HOLD-only CSV
        run: node --test tests/knowledge_management_lab.test.cjs
      - name: Test Problem Management synthetic state and HOLD-only CSV
        run: node --test tests/problem_management_lab.test.cjs
      - name: Test Incident Management native handoff and HOLD-only CSV
        run: node --test tests/incident_management_lab.test.cjs
      - name: Test CMDB source onboarding native IRE acceptance handoff
        run: node --test tests/cmdb_source_native_handoff.test.cjs
      - name: Test CMDB Data Manager preflight and HOLD-only DEV CSV
        run: node --test tests/cmdb_data_manager_policy.test.cjs
      - name: Test CMDB Health score provenance and immutable 24-gate DEV handoff
        run: node --test tests/cmdb_health_assurance.test.cjs
      - name: Test CMDB Health cohort integrity and synthetic denominator review
        run: node --test tests/cmdb_health_cohort.test.cjs
      - name: Test Tag Governance source and policy review with 25 HOLD-only DEV gates
        run: node --test tests/cmdb_tag_governance.test.cjs
      - name: Test CMDB relationship integrity synthetic graph and 30 native HOLD gates
        run: node --test tests/cmdb_relationship_assurance.test.cjs
      - name: Test 117-gate CMDB assurance source crosswalk and fail-closed exports
        run: node --test tests/cmdb_assurance_control_tower.test.cjs
      - name: Test Workbench source-to-DEV filters and HOLD-only export
        run: node --test tests/workbench_gap_board.test.cjs
      - name: Test quality gate
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test publication and audit regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate HTML navigation and accessibility basics
        run: python scripts/check_site.py
      - name: Verify complete deterministic public sitemap
        run: python scripts/generate_sitemap.py --check
      - name: Verify public explorer covers every root HTML page
        run: python scripts/reconcile_portfolio_explorer.py --check
      - name: Check evidence-aware explorer badges against public claim register
        run: python scripts/reconcile_explorer_evidence.py --check
      - name: Validate local links and fragment targets
        run: python scripts/check_local_links.py
      - name: Validate evidence classifications and provenance
        run: python scripts/check_verification_register.py
      - name: Check public assets for secrets and unapproved screenshots
        run: python scripts/check_publication.py
