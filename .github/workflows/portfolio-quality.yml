name: Portfolio quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test quality gate
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate HTML navigation and accessibility basics
        run: python scripts/check_site.py
      - name: Validate local links and fragment targets
        run: python scripts/check_local_links.py
      - name: Validate evidence classifications and provenance
        run: python scripts/check_verification_register.py
      - name: Check public assets for secrets and unapproved screenshots
        run: python scripts/check_publication.py
