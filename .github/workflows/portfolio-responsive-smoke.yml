name: Portfolio responsive browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'diagnostic-workbench-case-study.html'
      - 'reusable-delivery-patterns-case-study.html'
      - 'cmdb-ire-assurance.html'
      - 'cmdb-diagnostic-trust-lab.html'
      - 'major-incident-implementation-lab.html'
      - 'itsm-greenfield-build-sequencer.html'
      - 'screenshot-redaction-desk.html'
      - 'screenshot-receipt-verifier.html'
      - 'diagnostic-coverage-explorer.html'
      - 'knowledge-intelligence-acceptance-matrix.html'
      - 'portfolio-review-guide.html'
      - 'workbench-acceptance-playbook.html'
      - 'pattern-library-audit-trail.html'
      - 'operational-readiness-runbook.html'
      - 'incident-pack-native-pilot.html'
      - 'evidence/public-verification-register.json'
      - 'scripts/test_incident_pack_pilot.py'
      - 'scripts/test_operational_readiness_runbook.py'
      - 'scripts/test_pattern_library_audit_trail.py'
      - 'scripts/test_acceptance_worksheet.py'
      - 'scripts/browser_navigation_smoke.py'
      - '.github/workflows/portfolio-responsive-smoke.yml'
  workflow_dispatch:
concurrency:
  group: responsive-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  viewport-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: python -m pip install playwright==1.55.0
      # ubuntu-latest already includes the Chromium runtime libraries. Avoid
      # Playwright's --with-deps apt/font downloads, which failed when the
      # Ubuntu package mirror could not be resolved (run 43048806716).
      # The test only launches the headless browser, not full Chrome.
      - name: Install Chromium headless shell (without apt downloads)
        run: python -m playwright install chromium --only-shell
      - name: Verify operational readiness publication contract
        run: python scripts/test_operational_readiness_runbook.py
      - name: Verify Incident pack publication and provenance contract
        run: python scripts/test_incident_pack_pilot.py
      - name: Exercise navigation and case-study evidence boundaries at four viewport widths
        run: python scripts/browser_navigation_smoke.py
