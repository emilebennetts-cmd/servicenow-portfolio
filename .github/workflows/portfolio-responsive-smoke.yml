name: Portfolio responsive browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'workbench-architecture-gallery.html'
      - 'scripts/test_architecture_gallery_claim_boundaries.py'
      - 'scripts/browser_architecture_gallery_boundaries.py'
      - 'diagnostic-workbench-case-study.html'
      - 'reusable-delivery-patterns-case-study.html'
      - 'cmdb-ire-assurance.html'
      - 'cmdb-remediation-decision-lab.html'
      - 'scripts/test_cmdb_remediation_decision_lab.py'
      - 'scripts/browser_cmdb_remediation_decision_lab.py'
      - 'cmdb-diagnostic-trust-lab.html'
      - 'major-incident-implementation-lab.html'
      - 'itsm-greenfield-build-sequencer.html'
      - 'screenshot-redaction-desk.html'
      - 'screenshot-receipt-verifier.html'
      - 'screenshot-review-packet.html'
      - 'scripts/browser_review_packet.py'
      - 'scripts/test_review_packet_contract.py'
      - 'diagnostic-coverage-explorer.html'
      - 'knowledge-intelligence-acceptance-matrix.html'
      - 'portfolio-review-guide.html'
      - 'engineering-case-studies.html'
      - 'scripts/test_evidence_reviewer_routes.py'
      - 'scripts/browser_evidence_reviewer_routes.py'
      - 'workbench-acceptance-playbook.html'
      - 'pattern-library-audit-trail.html'
      - 'operational-readiness-runbook.html'
      - 'incident-pack-native-pilot.html'
      - 'native-assurance-coverage-atlas.html'
      - 'portfolio-explorer.html'
      - 'diagnostic-rescan-decision-lab.html'
      - 'delivery-case-study.html'
      - 'integration-contract-lab.html'
      - 'governed-handoff-contract.html'
      - 'handoff-contract-engine.js'
      - 'scripts/test_handoff_contract_sandbox.py'
      - 'scripts/browser_handoff_contract_sandbox.py'
      - 'diagnostic-gate-closure-lab.html'
      - 'scripts/test_diagnostic_gate_closure_lab.py'
      - 'scripts/browser_diagnostic_gate_closure_lab.py'
      - 'scripts/test_integration_contract_lab.py'
      - 'scripts/browser_integration_contract_lab.py'
      - 'scripts/test_delivery_plan_lab.py'
      - 'scripts/browser_delivery_plan_lab.py'
      - 'scripts/test_diagnostic_rescan_lab.py'
      - 'scripts/browser_diagnostic_rescan_lab.py'
      - 'scripts/test_portfolio_explorer.py'
      - 'scripts/browser_portfolio_explorer.py'
      - 'scripts/test_assurance_coverage_atlas.py'
      - 'evidence/public-verification-register.json'
      - 'scripts/test_incident_pack_pilot.py'
      - 'scripts/test_native_pack_acceptance_matrix.py'
      - 'scripts/browser_native_pack_acceptance_matrix.py'
      - 'scripts/test_operational_readiness_runbook.py'
      - 'scripts/test_entitlement_decision_desk.py'
      - 'scripts/browser_entitlement_decision_desk.py'
      - 'scripts/test_pattern_library_audit_trail.py'
      - 'scripts/test_acceptance_worksheet.py'
      - 'scripts/browser_navigation_smoke.py'
      - '.github/workflows/portfolio-responsive-smoke.yml'
  workflow_dispatch:
concurrency:
  group: responsive-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  viewport-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: python -m pip install playwright==1.55.0
      # ubuntu-latest already includes the Chromium runtime libraries. Avoid
      # Playwright's --with-deps apt/font downloads, which failed when the
      # Ubuntu package mirror could not be resolved (run 43048806716).
      # The test only launches the headless browser, not full Chrome.
      - name: Install Chromium headless shell (without apt downloads)
        run: python -m playwright install chromium --only-shell
      - name: Verify architecture gallery historical DEV/source boundary
        run: python scripts/test_architecture_gallery_claim_boundaries.py
      - name: Exercise architecture evidence cards at four viewport widths
        run: python scripts/browser_architecture_gallery_boundaries.py
      - name: Verify operational readiness publication contract
        run: python scripts/test_operational_readiness_runbook.py
      - name: Verify offline entitlement decisions remain HOLD-only
        run: python scripts/test_entitlement_decision_desk.py
      - name: Exercise entitlement desk at four viewport widths
        run: python scripts/browser_entitlement_decision_desk.py
      - name: Verify Incident pack publication and provenance contract
        run: python scripts/test_incident_pack_pilot.py
      - name: Verify source-pinned 29-case NOT RUN acceptance contract
        run: python scripts/test_native_pack_acceptance_matrix.py
      - name: Exercise the native acceptance matrix and safe CSV at four widths
        run: python scripts/browser_native_pack_acceptance_matrix.py
      - name: Verify Delivery Plan source and synthetic preview contract
        run: python scripts/test_delivery_plan_lab.py
      - name: Exercise Delivery Plan at four viewport widths
        run: python scripts/browser_delivery_plan_lab.py
      - name: Verify CMDB remediation decision contract
        run: python scripts/test_cmdb_remediation_decision_lab.py
      - name: Exercise CMDB remediation decisions at four viewport widths
        run: python scripts/browser_cmdb_remediation_decision_lab.py
      - name: Verify synthetic diagnostic rescan publication contract
        run: python scripts/test_diagnostic_rescan_lab.py
      - name: Exercise diagnostic rescan fixtures at four viewport widths
        run: python scripts/browser_diagnostic_rescan_lab.py
      - name: Verify governed handoff synthetic contract safeguards
        run: python scripts/test_handoff_contract_sandbox.py
      - name: Exercise governed handoff scenarios at four viewport widths
        run: python scripts/browser_handoff_contract_sandbox.py
      - name: Verify integration contract publication and authority safeguards
        run: python scripts/test_integration_contract_lab.py
      - name: Exercise integration outcomes at four viewport widths
        run: python scripts/browser_integration_contract_lab.py
      - name: Verify gate-closure publication and immutable HOLD contract
        run: python scripts/test_diagnostic_gate_closure_lab.py
      - name: Exercise gate-closure lab at four viewport widths
        run: python scripts/browser_diagnostic_gate_closure_lab.py
      - name: Verify searchable explorer publication contract
        run: python scripts/test_portfolio_explorer.py
      - name: Exercise local search and navigation at four viewport widths
        run: python scripts/browser_portfolio_explorer.py
      - name: Verify eight-record screenshot handoff contract
        run: python scripts/test_review_packet_contract.py
      - name: Exercise HOLD-only review packets at four viewport widths
        run: python scripts/browser_review_packet.py
      - name: Verify evidence-first reviewer routes structure and safe source claims
        run: python scripts/test_evidence_reviewer_routes.py
      - name: Exercise reviewer route selector, keyboard controls and download at four widths
        run: python scripts/browser_evidence_reviewer_routes.py
      - name: Exercise navigation and case-study evidence boundaries at four viewport widths
        run: python scripts/browser_navigation_smoke.py
