name: Portfolio responsive browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/browser_navigation_smoke.py'
      - '.github/workflows/portfolio-responsive-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewport-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: python -m pip install playwright==1.55.0
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise public navigation at phone, tablet and desktop widths
        run: python scripts/browser_navigation_smoke.py
